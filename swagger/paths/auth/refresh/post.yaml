tags:
  - Auth
summary: Refresh Session
operationId: refreshSession
description: Refresh user session and return new access token
security: []
responses:
  '200':
    description: Session successfully refreshed
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
            - data
          properties:
            status:
              type: integer
              example: 200
            message:
              type: string
              example: Successfully refreshed a session!
            data:
              type: object
              required:
                - accessToken
              properties:
                accessToken:
                  type: string
                  example: eyJhbGciOi...
  '401':
    $ref: ../../../components/responses/401.yaml
  '400':
    $ref: ../../../components/responses/400.yaml
